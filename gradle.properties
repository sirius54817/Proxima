# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Djava.io.tmpdir=/home/sirius/AndroidStudioProjects/proxima/.tmp

# Kotlin daemon JVM arguments
kotlin.daemon.jvmargs=-Xmx2048m

# Enable parallel execution and caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# Kotlin performance optimizations
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.code.style=official

# Kapt/KSP performance
kapt.incremental.apt=true
ksp.incremental=true

# Android performance
android.disallowKotlinSourceSets=false
android.nonTransitiveRClass=true
android.enableJetifier=false
android.enableR8.fullMode=true
android.defaults.buildfeatures.buildconfig=false

# Temp directories
systemProp.java.io.tmpdir=/home/sirius/AndroidStudioProjects/proxima/.tmp
systemProp.org.sqlite.tmpdir=/home/sirius/AndroidStudioProjects/proxima/.sqlite-tmp
